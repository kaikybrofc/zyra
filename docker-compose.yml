services:
  zyra:
    build: .
    restart: unless-stopped
    command: ['npm', 'run', 'start:connections']
    volumes:
      - zyra-data:/app/data
    environment:
      # Modo simples: uma única conexão explícita.
      WA_CONNECTION_ID: default
      # Para múltiplas conexões no mesmo processo, prefira definir WA_CONNECTION_IDS no .env.
      # Exemplo: WA_CONNECTION_IDS=default,loja1,loja2
      # Sem WA_CONNECTION_IDS, o bootstrap ainda pode descobrir conexões em auth_creds.
      WA_REDIS_URL: redis://redis:6379
      MYSQL_URL: mysql://zyra:zyra@mysql:3306/zyra
      WA_API_ENABLED: 'false'
      WA_WEBHOOK_RETRY_ENABLED: 'false'
      WA_WEBHOOK_OUTBOX_ENABLED: 'false'
      WA_ANTIBAN_ENABLED: 'true'
      WA_ANTIBAN_METRICS_ENABLED: 'false'
      WA_MYSQL_CONNECTION_LIMIT: '5'
      WA_MYSQL_MAX_IDLE: '2'
      WA_MYSQL_QUEUE_LIMIT: '100'
      WA_SQL_STORE_CONCURRENCY: '2'
      WA_SQL_EVENT_LOG_ENABLED: 'false'
      WA_SQL_MESSAGE_EVENTS_ENABLED: 'false'
      WA_SIGNAL_KEYS_CHUNK: '100'
      WA_AUTH_DISK_CONCURRENCY: '4'
      WA_MEDIA_AUTO_DOWNLOAD: 'false'
      WA_MEDIA_MAX_BYTES: '536870912'
      WA_COMMAND_TIMEOUT_MS: '30000'
      WA_ROUTER_MAX_PENDING_PER_QUEUE: '100'
      WA_MAX_CACHED_MESSAGES: '1000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

  api-webhook:
    build: .
    restart: unless-stopped
    command: ['npm', 'run', 'start:api-webhook']
    volumes:
      - zyra-data:/app/data
    environment:
      WA_CONNECTION_ID: default
      WA_REDIS_URL: redis://redis:6379
      MYSQL_URL: mysql://zyra:zyra@mysql:3306/zyra
      WA_API_ENABLED: 'true'
      WA_BOOTSTRAP_CONNECTIONS_ENABLED: 'false'
      WA_WEBHOOK_RETRY_ENABLED: 'false'
      WA_WEBHOOK_OUTBOX_ENABLED: 'false'
      WA_WEBHOOK_TIMEOUT_MS: '5000'
      WA_WEBHOOK_MAX_ATTEMPTS: '2'
      WA_WEBHOOK_OUTBOX_BATCH_SIZE: '10'
      WA_API_HOST: 0.0.0.0
      WA_API_PORT: '3000'
      WA_API_MEDIA_MAX_BYTES: '5242880'
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

  backfill:
    build: .
    restart: unless-stopped
    command: ['node', 'dist/core/db/backfill.js']
    volumes:
      - zyra-data:/app/data
    environment:
      WA_CONNECTION_ID: default
      MYSQL_URL: mysql://zyra:zyra@mysql:3306/zyra
      WA_BACKFILL_ONCE: 'false'
      WA_BACKFILL_INTERVAL_MS: '300000'
      WA_BACKFILL_BATCH_SIZE: '100'
      WA_BACKFILL_MAX_PASSES: '5'
      WA_BACKFILL_MAX_FAILURES: '3'
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: zyra
      MYSQL_USER: zyra
      MYSQL_PASSWORD: zyra
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zyra-data:
  mysql-data:
  redis-data:
