name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 20 representa o baseline mais próximo do runtime/container atual.
        # Node 22 valida compatibilidade adiantada.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kaikybrofc'

      - name: Show CI environment info
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "Registry: https://npm.pkg.github.com"
          echo "Scope: @kaikybrofc"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"

      - name: Validate GitHub Packages auth context
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "GH_PACKAGES_TOKEN/github.token ausente. O install não conseguirá baixar @kaikybrofc/logger-module do GitHub Packages." >&2
            exit 1
          fi
          echo "GitHub Packages token presente para npm ci."

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker build secret context
        env:
          NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "Token ausente para Docker BuildKit. O build da imagem não conseguirá acessar o pacote privado no GitHub Packages." >&2
            exit 1
          fi
          echo "Token disponível para docker build com GitHub Packages."

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            npm_token=${{ secrets.GH_PACKAGES_TOKEN || github.token }}
